<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Strux — WHOOP integration</title>
    <style>
      :root { color-scheme: light dark; --fg: #14171a; --muted: #5c6169; --bg: #ffffff; --rule: #e4e6ea; }
      @media (prefers-color-scheme: dark) { :root { --fg: #f2f4f6; --muted: #9ba1a8; --bg: #0d0f11; --rule: #24282c; } }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 3rem 1.25rem 5rem; background: var(--bg); color: var(--fg);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      main { max-width: 44rem; margin: 0 auto; }
      h1 { font-size: 1.8rem; line-height: 1.2; margin: 0 0 .5rem; letter-spacing: -.02em; }
      .lede { color: var(--muted); margin: 0 0 2rem; }
      figure { margin: 0 0 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
      figcaption { margin: 0 0 .75rem; }
      figcaption strong { display: block; }
      img { display: block; max-width: 100%; height: auto; max-height: 80vh; border-radius: 12px; border: 1px solid var(--rule); }
      footer { color: var(--muted); font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Strux — WHOOP integration</h1>
      <p class="lede">Screens from the Strux iOS app that read or display WHOOP data, for
        WHOOP API review. Taken from the current build with the developer's own account.</p>

      <figure>
        <figcaption><strong>1. Connect screen</strong>WHOOP is connected through WHOOP's own sign-in.</figcaption>
        <img src="4-connect-whoop-card.jpg" alt="WHOOP card on the Connect screen with a Connect button" />
      </figure>

      <figure>
        <figcaption><strong>2. Before connecting</strong>What is read, how, where it is kept (memory only, never stored), and how to withdraw and delete.</figcaption>
        <img src="5-before-connecting-disclosure.jpg" alt="Disclosure shown before connecting WHOOP" />
      </figure>

      <figure>
        <figcaption><strong>3. Today — readiness</strong>Recovery and HRV combined with training load, labelled "Data by WHOOP®".</figcaption>
        <img src="1-today-readiness.jpg" alt="Readiness card showing recovery, HRV and 7-day load, with a Data by WHOOP credit" />
      </figure>

      <figure>
        <figcaption><strong>4. Explanation, computed on the phone</strong>Fixed rules, no AI; marked as guidance, not medical advice.</figcaption>
        <img src="2-explanation-on-device.jpg" alt="Readiness card with a plain-language explanation" />
      </figure>

      <figure>
        <figcaption><strong>5. Trends — Recovery</strong>Average sleep, sleep performance and HRV baseline, labelled "Data by WHOOP®".</figcaption>
        <img src="3-trends-recovery.jpg" alt="Recovery card with average sleep, sleep performance and HRV baseline" />
      </figure>

      <figure>
        <figcaption><strong>6. Help, legal and account</strong>Support contact, privacy policy, terms, and account deletion.</figcaption>
        <img src="6-help-legal-account.jpg" alt="Help and legal section and account panel with Delete account" />
      </figure>

      <footer>Strux · <a href="../privacy.html">Privacy</a> · <a href="../terms.html">Terms</a> · eugene.grp@gmail.com</footer>
    </main>
  </body>
</html>
